<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crate Admin Dashboard</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body data-admin-section="dashboard">
    <main>
      <header class="admin-page-header">
        <div>
          <h1>Dashboard</h1>
          <p>System health, user stats, library stats, recent jobs, and warnings.</p>
        </div>
        <button class="primary" id="refreshButton" type="button">Refresh</button>
      </header>

      <div class="admin-message" id="message">Loading dashboard...</div>

      <section class="admin-grid">
        <div class="admin-panel">
          <div class="admin-panel-header"><h2>System Health</h2></div>
          <div class="admin-stats" id="healthStats"></div>
        </div>

        <div class="admin-grid two">
          <div class="admin-panel">
            <div class="admin-panel-header"><h2>User Statistics</h2></div>
            <div class="admin-stats" id="userStats"></div>
          </div>
          <div class="admin-panel">
            <div class="admin-panel-header"><h2>Library Statistics</h2></div>
            <div class="admin-stats" id="libraryStats"></div>
          </div>
        </div>

        <div class="admin-grid two">
          <div class="admin-panel">
            <div class="admin-panel-header"><h2>Recent Jobs</h2></div>
            <div id="recentJobs" class="admin-grid"></div>
          </div>
          <div class="admin-panel">
            <div class="admin-panel-header"><h2>Warnings / Alerts</h2></div>
            <div id="warnings" class="admin-grid"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="/adminShell.js"></script>
    <script>
      const message = document.getElementById('message');
      const refreshButton = document.getElementById('refreshButton');
      const healthStats = document.getElementById('healthStats');
      const userStats = document.getElementById('userStats');
      const libraryStats = document.getElementById('libraryStats');
      const recentJobs = document.getElementById('recentJobs');
      const warnings = document.getElementById('warnings');

      function stat(label, value) {
        return '<div class="admin-stat"><strong>' + CrateAdmin.escapeHtml(value ?? '-') + '</strong><span>' + CrateAdmin.escapeHtml(label) + '</span></div>';
      }

      function compactJob(label, run) {
        if (!run) return '<div class="admin-placeholder">' + CrateAdmin.escapeHtml(label) + ': no recent run found.</div>';
        const bits = [
          run.created_at || run.started_at || run.fetched_at,
          run.status,
          run.matched_tracks != null ? CrateAdmin.formatNumber(run.matched_tracks) + ' matched' : '',
          run.unmatched_tracks != null ? CrateAdmin.formatNumber(run.unmatched_tracks) + ' unmatched' : '',
        ].filter(Boolean).join(' · ');
        return '<div class="admin-card"><h3>' + CrateAdmin.escapeHtml(label) + '</h3><p>' + CrateAdmin.escapeHtml(bits || 'Recent job recorded.') + '</p></div>';
      }

      function warning(text) {
        return '<div class="admin-placeholder">' + CrateAdmin.escapeHtml(text) + '</div>';
      }

      function latest(array) {
        return Array.isArray(array) && array.length ? array[0] : null;
      }

      function renderWarnings(status, diagnostics, coverage) {
        const items = [];
        const users = diagnostics.users || [];
        const unmatched = users.reduce((sum, user) => sum + Number(user.unmatched_tracks || user.total_unmatched_tracks || 0), 0);
        if (unmatched > 0) items.push(CrateAdmin.formatNumber(unmatched) + ' unmatched tracks remain across users.');
        if ((coverage.summary?.estimated_recoverable_tracks || 0) > 0) items.push(CrateAdmin.formatNumber(coverage.summary.estimated_recoverable_tracks) + ' potentially recoverable tracks in intelligence coverage.');
        if ((status.spotify_config?.ok || status.spotify?.configured) === false) items.push('Spotify configuration is incomplete.');
        warnings.innerHTML = items.length ? items.map(warning).join('') : warning('No dashboard warnings from current read-only checks.');
      }

      async function loadDashboard() {
        refreshButton.disabled = true;
        message.textContent = 'Loading dashboard...';
        message.className = 'admin-message';
        try {
          const [health, status, diagnostics, coverage] = await Promise.all([
            CrateAdmin.requestJson('/health'),
            CrateAdmin.requestJson('/crate/admin/status'),
            CrateAdmin.requestJson('/crate/admin/user-diagnostics'),
            CrateAdmin.requestJson('/crate/admin/intelligence-coverage'),
          ]);

          const users = diagnostics.users || [];
          const liked = users.reduce((sum, user) => sum + Number(user.total_liked_tracks || 0), 0);
          const matched = users.reduce((sum, user) => sum + Number(user.matched_tracks || 0), 0);
          const unmatched = users.reduce((sum, user) => sum + Number(user.unmatched_tracks || user.total_unmatched_tracks || 0), 0);
          const matchPct = liked ? Math.round((matched / liked) * 1000) / 10 + '%' : '-';

          healthStats.innerHTML = [
            stat('Service', health.status || status.status || '-'),
            stat('Uptime', health.uptime_seconds ? CrateAdmin.formatNumber(Math.round(health.uptime_seconds)) + 's' : '-'),
            stat('Environment', status.environment || '-'),
          ].join('');
          userStats.innerHTML = [
            stat('Users', users.length),
            stat('Liked Songs', CrateAdmin.formatNumber(liked)),
            stat('Match Rate', matchPct),
          ].join('');
          libraryStats.innerHTML = [
            stat('Matched', CrateAdmin.formatNumber(matched)),
            stat('Unmatched', CrateAdmin.formatNumber(unmatched)),
            stat('Coverage Score', coverage.summary?.overall_readiness_score ?? coverage.readiness_progress?.current?.A ?? '-'),
          ].join('');
          recentJobs.innerHTML = [
            compactJob('Latest Scan', latest(status.recent_scan_runs || status.scan_runs)),
            compactJob('Latest Sort', latest(status.recent_sort_runs || status.sort_runs)),
            compactJob('Latest Playlist Sync', latest(status.recent_playlist_sync_runs || status.playlist_sync_runs)),
          ].join('');
          renderWarnings(status, diagnostics, coverage);
          message.textContent = 'Dashboard loaded.';
        } catch (error) {
          message.textContent = error.message;
          message.className = 'admin-message error';
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener('click', loadDashboard);
      loadDashboard();
    </script>
  </body>
</html>
