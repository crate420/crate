<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crate Admin Unmatched</title>
    <style>
      :root { --bg:#f6f8fb; --panel:#fff; --text:#17202a; --muted:#657080; --border:#d7dde5; --action:#1769aa; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; }
      main { max-width:1180px; margin:0 auto; padding:24px; }
      header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; }
      h1 { margin:0; font-size:24px; }
      h2 { margin:0 0 10px; font-size:18px; }
      .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
      button, a.button { border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); cursor:pointer; display:inline-flex; align-items:center; min-height:34px; padding:6px 10px; text-decoration:none; font:inherit; }
      button.primary { background:var(--action); border-color:var(--action); color:#fff; }
      .message { min-height:22px; color:var(--muted); margin-bottom:12px; }
      .grid { display:grid; grid-template-columns:360px 1fr; gap:14px; align-items:start; }
      .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; }
      .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
      .stat { border:1px solid var(--border); border-radius:8px; background:#fff; padding:10px; text-align:center; }
      .stat strong { display:block; font-size:24px; }
      .stat span { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; }
      .genre-list, .track-list { display:grid; gap:8px; }
      .genre, .track { border:1px solid var(--border); border-radius:8px; background:#fff; padding:10px; }
      .genre { display:flex; justify-content:space-between; gap:12px; }
      .track strong { display:block; font-size:15px; }
      .muted { color:var(--muted); }
      .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
      .tag { border-radius:999px; background:#eef2f7; color:#334155; padding:2px 7px; font-size:12px; }
      @media (max-width: 820px) { .grid,.summary { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Crate Unmatched Review</h1>
          <div class="muted">Tracks and genres still missing a playlist assignment.</div>
        </div>
        <nav class="toolbar">
          <a class="button" href="/admin.html">Admin Home</a>
          <a class="button" href="/admin-review.html">Artist Review Queue</a>
          <button class="primary" id="refreshButton" type="button">Refresh</button>
        </nav>
      </header>
      <div class="message" id="message">Loading...</div>
      <section class="summary" aria-label="Unmatched summary">
        <div class="stat"><strong id="totalUnmatched">-</strong><span>Total unmatched</span></div>
        <div class="stat"><strong id="withGenres">-</strong><span>With genres</span></div>
        <div class="stat"><strong id="withoutGenres">-</strong><span>No genres</span></div>
      </section>
      <section class="grid">
        <article class="panel">
          <h2>Top Unmatched Genres</h2>
          <div class="genre-list" id="genreList"></div>
        </article>
        <article class="panel">
          <h2>Sample Unmatched Tracks</h2>
          <div class="track-list" id="trackList"></div>
        </article>
      </section>
    </main>
    <script>
      const message = document.getElementById('message');
      const totalUnmatched = document.getElementById('totalUnmatched');
      const withGenres = document.getElementById('withGenres');
      const withoutGenres = document.getElementById('withoutGenres');
      const genreList = document.getElementById('genreList');
      const trackList = document.getElementById('trackList');
      const refreshButton = document.getElementById('refreshButton');

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      async function requestJson(url) {
        const response = await fetch(url, { credentials: 'include' });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.message || body.error || 'Request failed: ' + response.status);
        return body;
      }

      function renderGenres(genres = []) {
        genreList.innerHTML = genres.length ? genres.slice(0, 50).map((item) => `
          <div class="genre"><strong>${item.genre || item.name || 'Unknown'}</strong><span>${formatNumber(item.count)}</span></div>
        `).join('') : '<p class="muted">No unmatched genres found.</p>';
      }

      function renderTracks(tracks = []) {
        trackList.innerHTML = tracks.length ? tracks.slice(0, 100).map((track) => {
          const artists = track.artist_names || track.artists || '';
          const genres = Array.isArray(track.spotify_genres) ? track.spotify_genres : (track.genres || []);
          return `
            <div class="track">
              <strong>${track.track_title || track.name || 'Untitled track'}</strong>
              <div class="muted">${artists} ${track.album_name ? '&middot; ' + track.album_name : ''}</div>
              <div class="tags">${genres.map((genre) => `<span class="tag">${genre}</span>`).join('') || '<span class="tag">No genres</span>'}</div>
            </div>
          `;
        }).join('') : '<p class="muted">No unmatched tracks found.</p>';
      }

      async function loadReview() {
        refreshButton.disabled = true;
        message.textContent = 'Loading unmatched diagnostics...';
        try {
          const [diagnostics, unmatched] = await Promise.all([
            requestJson('/crate/unmatched-diagnostics'),
            requestJson('/crate/unmatched?limit=100'),
          ]);
          totalUnmatched.textContent = formatNumber(diagnostics.total_unmatched_tracks);
          withGenres.textContent = formatNumber(diagnostics.unmatched_tracks_with_genres);
          withoutGenres.textContent = formatNumber(diagnostics.unmatched_tracks_with_no_genres);
          renderGenres(diagnostics.top_unmatched_genres || []);
          renderTracks(Array.isArray(unmatched) ? unmatched : unmatched.tracks || []);
          message.textContent = 'Review data loaded.';
        } catch (err) {
          message.textContent = 'Failed to load review data: ' + err.message;
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener('click', loadReview);
      loadReview();
    </script>
  </body>
</html>
